[build]
publish = "."
functions = "netlify/functions"

[[redirects]]
from = "/api/lead"
to = "/.netlify/functions/lead"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[functions]
node_bundler = "esbuild"

# Scheduled Function — DOP Chat tygodniowy raport
# Pon 06:00 UTC = pon 08:00 CET / 07:00 CEST (lato)
[functions."chat-report"]
schedule = "0 6 * * 1"
